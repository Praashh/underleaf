name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            tectonic_backend: pkg-config
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            tectonic_backend: pkg-config
          - platform: ubuntu-22.04
            args: ""
            tectonic_backend: pkg-config
          - platform: windows-latest
            args: ""
            tectonic_backend: vcpkg
            vcpkg_root: 'C:\vcpkg'
            vcpkgrs_triplet: x64-windows-static-md
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config \
            libicu-dev libfontconfig1-dev libgraphite2-dev libharfbuzz-dev

      - name: macOS deps
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install pkg-config icu4c
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Cache vcpkg dependencies
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-x64-windows-static-md-v2
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-windows-static-md-

      - name: Windows deps (vcpkg for Tectonic)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          vcpkg install --triplet x64-windows-static-md --clean-after-build \
            fontconfig freetype "harfbuzz[graphite2]" icu libpng graphite2
          echo "TECTONIC_DEP_BACKEND=vcpkg" >> "$GITHUB_ENV"
          echo 'VCPKG_ROOT=C:\vcpkg' >> "$GITHUB_ENV"
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> "$GITHUB_ENV"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TECTONIC_DEP_BACKEND: ${{ matrix.tectonic_backend }}
          VCPKG_ROOT: ${{ matrix.vcpkg_root || '' }}
          VCPKGRS_TRIPLET: ${{ matrix.vcpkgrs_triplet || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Underleaf ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
